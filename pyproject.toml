[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tides-changes"
version = "0.1.0"
description = "Pipeline for collecting and submitting CHANGES transients to 4MOST on behalf of S16 CHANGES"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prefect>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "confluent-kafka",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tides_changes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
